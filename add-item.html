<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Inventory Item</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h3>Add New Inventory Item</h3>

      <form id="addItemForm">
        <div class="form-group">
          <label for="partName">Part Name:</label>
          <input type="text" id="partName" required />
          <span id="partNameError" class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="partCode">Part Code:</label>
          <input type="text" id="partCode" required />
          <span id="partCodeError" class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity:</label>
          <input type="number" id="quantity" required />
          <span id="quantityError" class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="mrp">MRP:</label>
          <input type="number" id="mrp" required />
          <span id="mrpError" class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="sellingPrice">Selling price:</label>
          <input type="number" id="sellingPrice" required />
          <span id="sellingPriceError" class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="inwardDate">Inward Date:</label>
          <input type="date" id="inwardDate" required />
          <span id="inwardDateError" class="error-message"></span>
        </div>

        <div class="form-actions">
          <button type="submit">Add Item</button>
          <button type="button" onclick="goBack()">Cancel</button>
        </div>
      </form>
    </div>

    <script>
      document
        .getElementById("addItemForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          clearErrorMessages();

          const partName = document.getElementById("partName").value.trim();
          const partCode = document.getElementById("partCode").value.trim();
          const quantity = parseInt(
            document.getElementById("quantity").value.trim(),
            10
          );
          const mrp = parseFloat(document.getElementById("mrp").value.trim());
          const sellingPrice = parseFloat(
            document.getElementById("sellingPrice").value.trim()
          );
          const inwardDate = document.getElementById("inwardDate").value.trim();

          let valid = true;

          if (!partName) {
            document.getElementById("partNameError").textContent =
              "Part Name is required!";
            valid = false;
          }
          if (!partCode) {
            document.getElementById("partCodeError").textContent =
              "Part Code is required!";
            valid = false;
          }
          if (!quantity || quantity <= 0) {
            document.getElementById("quantityError").textContent =
              "Quantity must be greater than 0!";
            valid = false;
          }
          if (!mrp || mrp <= 0) {
            document.getElementById("mrpError").textContent =
              "MRP must be greater than 0!";
            valid = false;
          }
          if (!sellingPrice || sellingPrice <= 0) {
            document.getElementById("sellingPriceError").textContent =
              "Selling Price must be greater than 0!";
            valid = false;
          }
          if (!inwardDate) {
            document.getElementById("inwardDateError").textContent =
              "Inward Date is required!";
            valid = false;
          }

          if (valid) {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            const existingItemIndex = inventory.findIndex(
              (item) => item.partCode === partCode && item.partName === partName
            );

            if (existingItemIndex !== -1) {
              inventory[existingItemIndex].quantity =
                parseInt(inventory[existingItemIndex].quantity, 10) + quantity;
            }
            // Check if selling price is undefined and update it
            if (
              inventory[existingItemIndex].sellingPrice === undefined ||
              inventory[existingItemIndex].sellingPrice === 0
            ) {
              inventory[existingItemIndex].sellingPrice = sellingPrice;
            } else {
              inventory.push({
                partName,
                partCode,
                quantity,
                mrp,
                inwardDate,
                sellingPrice,
              });
            }

            localStorage.setItem("inventory", JSON.stringify(inventory));

            window.location.href = "index.html";
          }
        });

      function clearErrorMessages() {
        document.getElementById("partNameError").textContent = "";
        document.getElementById("partCodeError").textContent = "";
        document.getElementById("quantityError").textContent = "";
        document.getElementById("mrpError").textContent = "";
        document.getElementById("sellingPriceError").textContent = "";
        document.getElementById("inwardDateError").textContent = "";
      }

      function goBack() {
        window.history.back();
      }
    </script>
  </body>
</html>
