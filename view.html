<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Item Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }

    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }

    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f1f1f1;
    }

    .back-button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      text-align: center;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .back-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Item Details</h2>
    <div class="details" id="itemDetails"></div>
    <button class="back-button" onclick="goBack()">Back to Inventory</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const partCode = urlParams.get("partCode");

    function displayItemDetails() {
      const inventory = JSON.parse(localStorage.getItem("inventory")) || [];
      const item = inventory.find((item) => item.partCode === partCode);

      if (item) {
        document.getElementById("itemDetails").innerHTML = `
          <div class="detail-item">
            <label>Name</label>
            <input type="text" value="${item.partName}" readonly />
          </div>
          <div class="detail-item">
            <label>Name</label>
            <input type="text" value="${item.partCode}" readonly />
          </div>
          <div class="detail-item">
            <label>Name</label>
            <input type="number" value="${item.quantity}" readonly />
          </div>
          <div class="detail-item">
            <label>Name</label>
            <input type="text" value="₹${item.mrp}" readonly />
          </div>
          <div class="detail-item">
            <label>Name</label>
            <input type="text" value="${item.discount || 0}%" readonly />
          </div>
          <div class="detail-item">
            <label>Name</label>
            <input type="text" value="${formatDate(item.inwardDate)}" readonly />
          </div>
          <div class="detail-item">
            <label>Name</label>
            <input type="text" value="₹${item.sellingPrice || 'Not Available'}" readonly />
          </div>
        `;
      } else {
        document.getElementById("itemDetails").innerHTML = `<p>Item not found!</p>`;
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return "Invalid Date";
      return `${date.getDate().toString().padStart(2, "0")}-${(date.getMonth() + 1)
        .toString()
        .padStart(2, "0")}-${date.getFullYear()}`;
    }

    function goBack() {
      window.history.back();
    }

    displayItemDetails();
  </script>
</body>
</html>
